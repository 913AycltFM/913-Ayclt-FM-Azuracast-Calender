name: Update AzuraCast iCal

on:
  schedule:
    # Runs exactly every 6 minutes (subject to GitHub queue latency)
    - cron: '*/6 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run schedule exporter
        run: python export_schedule.py

      # Native GitHub CLI reliably drops the old file and force-uploads the new one
      - name: Force Overwrite Calendar Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload calendar-data azuracast_schedule.ics --clobber

      # Keeps repository marked active so GitHub never pauses your cron schedule
      - name: Keep Workflow Active
        uses: gautamkrishnar/keepalive-workflow@v1
