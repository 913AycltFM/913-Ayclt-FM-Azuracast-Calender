name: Update AzuraCast iCal

on:
  schedule:
    # Runs exactly every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run schedule exporter
        run: python export_schedule.py

      - name: Upload Calendar to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: calendar-data
          name: Live AzuraCast Calendar
          draft: false
          prerelease: false
          files: azuracast_schedule.ics
