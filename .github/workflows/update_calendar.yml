name: Update AzuraCast iCal

on:
  schedule:
    # Runs exactly every 6 minutes (subject to GitHub queue latency)
    - cron: '*/6 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Executes your script to grab fresh data from AzuraCast
      - name: Run schedule exporter
        run: python export_schedule.py

      # Native GitHub CLI reliably drops the old file and force-uploads the new one
      - name: Force Overwrite Calendar Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload calendar-data azuracast_schedule.ics --clobber

      # Native Keep-Alive: Safely logs a timestamp to prevent the 6-min cron from falling asleep
      - name: Keep Workflow Active
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .github/logs
          date +%Y-%m-%dT%H:%M:%SZ > .github/logs/heartbeat.log
          git add .github/logs/heartbeat.log
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: workflow heartbeat [skip ci]" && git push)
