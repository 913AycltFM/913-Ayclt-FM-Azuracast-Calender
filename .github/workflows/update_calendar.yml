name: Update AzuraCast Calendar

on:
  schedule:
    # Every 5 minutes, offset from the hour to reduce scheduling contention.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: azuracast-calendar
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and validate rolling 7-day calendar
        env:
          AZURACAST_API_KEY: ${{ secrets.AZURACAST_API_KEY }}
        run: |
          echo "===== CALENDAR UPDATE START ====="
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          python -m pip install --disable-pip-version-check Pillow
          python -m py_compile export_schedule.py generate_event_covers.py
          python export_schedule.py
          python generate_event_covers.py

          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("azuracast_schedule.ics")
          data = p.read_text(encoding="utf-8")
          lines = data.splitlines()

          if not lines or lines[0] != "BEGIN:VCALENDAR":
              raise SystemExit("Invalid calendar: missing BEGIN:VCALENDAR.")
          if lines[-1] != "END:VCALENDAR":
              raise SystemExit("Invalid calendar: missing END:VCALENDAR.")

          event_count = sum(1 for line in lines if line == "BEGIN:VEVENT")
          end_event_count = sum(1 for line in lines if line == "END:VEVENT")
          if event_count != end_event_count:
              raise SystemExit(f"Invalid calendar: VEVENT mismatch {event_count}/{end_event_count}.")
          if event_count == 0:
              raise SystemExit("Refusing to publish an empty calendar; check the AzuraCast API and schedules.")

          uids = [line[4:] for line in lines if line.startswith("UID:")]
          if len(uids) != event_count:
              raise SystemExit(f"Invalid calendar: expected {event_count} UID fields, found {len(uids)}.")
          if len(uids) != len(set(uids)):
              raise SystemExit("Invalid calendar: duplicate UID detected.")

          timestamp_fields = 0
          for line in lines:
              if line.startswith(("DTSTART:", "DTEND:", "DTSTAMP:")):
                  value = line.split(":", 1)[1]
                  if not re.fullmatch(r"\d{8}T\d{6}Z", value):
                      raise SystemExit(f"Invalid UTC timestamp: {line}")
                  timestamp_fields += 1

          if timestamp_fields != event_count * 3:
              raise SystemExit("Invalid calendar: unexpected timestamp field count.")

          # Validate required fields and ensure every event has a positive duration.
          events = []
          current = None
          for line in lines:
              if line == "BEGIN:VEVENT":
                  current = {}
              elif line == "END:VEVENT" and current is not None:
                  required = ("UID", "DTSTART", "DTEND", "DTSTAMP", "SUMMARY")
                  missing = [key for key in required if key not in current]
                  if missing:
                      raise SystemExit("Invalid VEVENT: missing " + ", ".join(missing))
                  if current["DTEND"] <= current["DTSTART"]:
                      raise SystemExit("Invalid VEVENT: DTEND must be after DTSTART.")
                  events.append(current)
                  current = None
              elif current is not None and ":" in line and not line.startswith(" "):
                  key, value = line.split(":", 1)
                  current[key.split(";", 1)[0]] = value

          if len(events) != event_count:
              raise SystemExit("Invalid calendar: failed to parse every VEVENT.")

          print(f"Validated calendar: {event_count} VEVENT(s), {p.stat().st_size} bytes.")
          print("===== CALENDAR VALIDATION PASSED =====")
          PY

      - name: Commit calendar to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- azuracast_schedule.ics; then
            echo "Calendar content did not change; no commit needed."
          else
            git add azuracast_schedule.ics event_covers/
            git commit -m "chore: update AzuraCast calendar"
            git push origin HEAD:main
            echo "Calendar commit pushed successfully."
            git log -1 --oneline
          fi

      - name: Update calendar release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing azuracast_schedule.ics to release calendar-data..."
          if ! gh release view calendar-data >/dev/null 2>&1; then
            gh release create calendar-data --title "Calendar Feed" --notes "Automatically updated AzuraCast iCalendar feed."
          fi
          gh release upload calendar-data azuracast_schedule.ics --clobber
          echo "Release asset published successfully."
          gh release view calendar-data --json name,tagName,url,assets
          echo "===== CALENDAR UPDATE COMPLETE ====="
